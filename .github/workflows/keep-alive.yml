name: keep-alive

# Backup pinger so the free-tier service never idles into sleep during judging.
# (Pair with an external monitor such as cron-job.org for precise timing.)
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          curl -fsS --max-time 60 --retry 3 \
            https://queuestorm-investigator-91iq.onrender.com/health
